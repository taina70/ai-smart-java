spring.application.name=ai-content-extractor

# Força o Spring a usar o H2 em memória sem buscar conexões externas
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Inicializa automaticamente as tabelas na memória RAM
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Mantém o console visual do H2 ativo (Acessível em http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true
